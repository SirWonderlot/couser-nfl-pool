<title>Test Week Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#EDF1F5; --card:#FFFFFF; --soft:#F3F7FA;
  --ink:#0F1E24; --ink-2:#4E626C; --ink-3:#8595A0;
  --line:#E1EAF0; --line-2:#CFDCE5;
  --accent:#0F9D8F; --accent-dark:#0B6B5D; --accent-soft:#E2F5F1;
  --hit:#12A05C; --hit-bg:#DCF5E7; --hit-ink:#0A6B3C;
  --miss-bg:#EDF0F3;
  --win:#E9A400; --win-bg:#FFF6DC; --win-ink:#8A6200;
  --shadow:0 1px 2px rgba(15,30,36,.05), 0 20px 32px -26px rgba(15,30,36,.5);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Manrope",-apple-system,"Helvetica Neue",Arial,sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; text-wrap:balance}
input{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.wrap{max-width:1260px; margin:0 auto; padding:0 18px 90px}

/* ---------- top navigation ---------- */
.topnav{background:var(--card); border-bottom:1px solid var(--line)}
.topnav__in{margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-weight:800; font-size:14.5px; letter-spacing:-.015em}
.brand em{font-style:normal; color:var(--ink-3); font-weight:600}
.navlinks{margin-left:auto; display:flex; gap:8px}
.navlink{text-decoration:none; font-weight:700; font-size:14.5px; color:var(--ink-2);
  padding:9px 16px; border-radius:99px; border:2px solid transparent}
.navlink:hover{background:var(--soft); color:var(--ink)}
.navlink.on{background:var(--accent-soft); color:var(--accent-dark); border-color:var(--accent)}
@media(max-width:540px){ .navlink{padding:8px 13px; font-size:13.5px} .brand{font-size:13.5px} }

/* masthead */
.mast{background:var(--card); border-bottom:1px solid var(--line)}
.mast__in{max-width:1260px; margin:0 auto; padding:32px 18px 0; display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap}
.eyebrow{font-weight:800; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.mast h1{font-size:clamp(38px,7vw,58px); font-weight:800; letter-spacing:-.04em; line-height:.94; margin-top:10px}
.mast__sub{color:var(--ink-2); margin:10px 0 0; max-width:54ch; font-size:16px}
.tally{margin-left:auto; display:flex; gap:12px; flex-wrap:wrap}
.stat{background:var(--soft); border-radius:20px; padding:13px 19px; min-width:112px}
.stat span{display:block; font-weight:700; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.stat b{display:block; font-size:25px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin-top:2px}
.stat.lead{background:var(--win-bg); color:var(--win-ink)}
.stat.lead b{font-size:18px; letter-spacing:-.02em}

/* week tabs */
.tabs{max-width:1260px; margin:0 auto; padding:22px 18px 0; display:flex; gap:6px; overflow-x:auto}
.tab{
  flex:0 0 auto; font-family:inherit; font-weight:700; font-size:14.5px; letter-spacing:-.01em;
  background:none; border:0; border-bottom:3px solid transparent; color:var(--ink-3);
  padding:11px 16px 13px; cursor:pointer; white-space:nowrap; border-radius:8px 8px 0 0;
}
.tab:hover{color:var(--ink); background:var(--soft)}
.tab.on{color:var(--accent-dark); border-bottom-color:var(--accent)}
.tab .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--win); margin-left:7px; vertical-align:1px}
.tab.now{color:#1B5FC0; background:#E8F1FD}
.tab.now:hover{color:#14498F; background:#DCE9FB}
.tab .nowtag{
  display:inline-block; margin-left:8px; padding:3px 8px; border-radius:99px;
  background:#1B5FC0; color:#fff; font-size:10px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  vertical-align:1px;
}
.tab.season{margin-left:auto; padding-left:22px}

/* controls */
.controls{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:20px 22px;
  margin-top:24px; display:flex; gap:20px; align-items:center; flex-wrap:wrap}
.controls__lead{font-weight:800; font-size:15px; letter-spacing:-.01em}
.controls__lead span{display:block; font-weight:500; font-size:14px; color:var(--ink-3)}
.ctl{display:flex; flex-direction:column; gap:6px}
.ctl label{font-weight:700; font-size:13px; color:var(--ink-2)}
.ctl input{width:110px; padding:11px 12px; text-align:center; font-weight:800; font-size:19px;
  background:var(--soft); border:2px solid var(--line); border-radius:14px; font-variant-numeric:tabular-nums}
.ctl input:focus{border-color:var(--accent); background:#fff; outline:none}
.spacer{margin-left:auto}
.btn{font-family:inherit; font-weight:700; font-size:14.5px; background:var(--soft); color:var(--ink);
  border:2px solid var(--line); border-radius:99px; padding:12px 20px; cursor:pointer}
.btn:hover{border-color:var(--line-2)}
.btn--go{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn--go:hover{background:var(--accent-dark); border-color:var(--accent-dark)}

/* winner banner */
.banner{display:none; align-items:center; gap:16px; margin-top:16px; padding:18px 24px;
  background:var(--win-bg); border-radius:24px; border:2px solid var(--win)}
.banner.on{display:flex}
.banner .cup{
  font-weight:800; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--win-ink); background:#fff; border:2px solid var(--win); border-radius:99px; padding:5px 12px;
}
.banner b{font-size:19px; font-weight:800; letter-spacing:-.02em; color:var(--win-ink)}
.banner span{color:var(--win-ink); font-size:15px; opacity:.85}

/* sealed */
.sealed{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:34px; margin-top:24px}
.sealed__head{display:flex; gap:18px; align-items:flex-start}
.sealed__head .lk{flex:0 0 auto; width:52px; height:52px; border-radius:18px; display:grid; place-items:center;
  background:var(--accent-soft); font-size:24px}
.sealed h2{font-size:27px; font-weight:800; letter-spacing:-.03em}
.sealed__head p{color:var(--ink-2); margin:6px 0 0; max-width:56ch; font-size:16px}
.clock{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap}
.clock div{background:var(--soft); border-radius:18px; padding:14px 20px; min-width:96px; text-align:center}
.clock b{display:block; font-size:32px; font-weight:800; letter-spacing:-.04em; font-variant-numeric:tabular-nums; line-height:1}
.clock span{display:block; font-weight:700; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-top:5px}
.sealed h3{font-size:15px; font-weight:800; margin-top:32px; letter-spacing:-.01em}
.sealed h3 em{font-style:normal; color:var(--ink-3); font-weight:600}
.inlist{list-style:none; margin:14px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
.inlist li{display:flex; align-items:center; gap:12px; background:var(--soft); border-radius:16px; padding:12px 16px}
.inlist .ok{flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--hit-bg); color:var(--hit-ink);
  display:grid; place-items:center; font-size:13px; font-weight:800; box-shadow:inset 0 0 0 2px var(--hit)}
.inlist b{display:block; font-weight:600; font-size:15px; letter-spacing:-.01em}
.inlist span{display:block; font-size:12.5px; color:var(--ink-3)}
.peek{margin-top:28px; padding-top:22px; border-top:2px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.peek p{margin:0; color:var(--ink-3); font-size:13.5px; max-width:44ch}

/* tables */
.scroller{margin-top:20px; overflow-x:auto; background:var(--card); border-radius:26px; box-shadow:var(--shadow)}
table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%}
th,td{padding:0; text-align:center; vertical-align:middle}
thead th{position:sticky; top:0; z-index:20; background:var(--card); padding:14px 5px 12px; border-bottom:2px solid var(--line)}
.c-rank{position:sticky; left:0; z-index:25; width:52px; min-width:52px; background:var(--card)}
.c-team{position:sticky; left:52px; z-index:25; width:186px; min-width:186px; background:var(--card);
  text-align:left; padding-left:14px !important; border-right:2px solid var(--line)}
thead .c-rank,thead .c-team{z-index:30}
tbody td{border-bottom:1px solid var(--line); height:64px; background:var(--card)}
tbody tr:last-child td{border-bottom:0}
.hd{font-weight:800; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); line-height:1.3}
.rank{font-weight:800; font-size:15px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.who b{display:block; font-weight:600; font-size:15.5px; line-height:1.3; letter-spacing:-.01em}
.who span{display:block; font-size:13px; color:var(--ink-3); line-height:1.3; font-weight:500}
.c-score{width:92px; min-width:92px; border-left:3px solid var(--line-2)}
tbody td.c-score,thead th.c-score,tfoot td.c-score{background:var(--soft)}
.score{font-weight:800; font-size:27px; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1}
.score em{display:block; font-style:normal; font-size:11px; font-weight:700; color:var(--ink-3); margin-top:2px}

/* week grid bits */
.gcol{width:66px; min-width:66px}
.gh{display:flex; flex-direction:column; gap:4px; align-items:center}
.gh__pick{display:flex; flex-direction:column; align-items:center; gap:3px; width:54px; padding:5px 0 4px;
  background:var(--soft); border:2px solid transparent; border-radius:14px; cursor:pointer;
  font-family:inherit; font-weight:700; font-size:10.5px; letter-spacing:.04em; color:var(--ink-3); line-height:1}
.gh__pick img{width:26px; height:26px; border-radius:50%; display:block; background:#fff}
.gh__pick:hover{border-color:var(--line-2)}
.gh__pick.win{background:var(--hit-bg); border-color:var(--hit); color:var(--hit-ink)}
.gh__at{font-weight:800; font-size:9px; letter-spacing:.1em; color:#B9C6CE}
th.gcol.gotw{box-shadow:inset 0 -4px 0 var(--accent)}
.cell{width:46px; height:46px; margin:0 auto; border-radius:14px; display:grid; place-items:center; background:var(--soft)}
.cell img{width:34px; height:34px; border-radius:50%; display:block; background:#fff}
.cell.hit{background:var(--hit-bg); box-shadow:inset 0 0 0 2px var(--hit)}
.cell.miss{background:var(--miss-bg)}
.cell.miss img{opacity:.2; filter:grayscale(1)}
.tiecol{width:88px; min-width:88px; border-left:2px solid var(--line)}
.tieval{font-weight:800; font-size:17px; font-variant-numeric:tabular-nums}
.tieoff{font-weight:700; font-size:13px; color:var(--ink-3)}
.tieoff.best{color:var(--hit-ink)}
tfoot td{border-top:2px solid var(--line); padding:12px 5px; background:var(--soft)}
tfoot .c-rank,tfoot .c-team{background:var(--soft)}
.consensus{display:flex; flex-direction:column; gap:5px; align-items:center}
.cbar{width:50px; height:8px; border-radius:99px; overflow:hidden; display:flex; background:var(--line)}
.cbar i{display:block; height:100%}
.cpct{font-weight:700; font-size:11px; color:var(--ink-3)}
.foot-lbl{text-align:left; font-weight:800; font-size:12.5px; color:var(--ink-2)}

/* winning row, used by both tables */
tbody tr.champ td{background:var(--win-bg)}
tbody tr.champ .c-rank,tbody tr.champ .c-team,tbody tr.champ td.c-score{background:var(--win-bg)}
tbody tr.champ .rank,tbody tr.champ .who b,tbody tr.champ .score{color:var(--win-ink)}
tbody tr.champ .cell{background:#fff}
tbody tr.champ .cell.hit{background:var(--hit-bg)}
tbody tr.champ .cell.miss{background:#F4EEDC}

/* season standings */
.wkcol{width:74px; min-width:74px}
.wk{font-weight:800; font-size:19px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.wk.none{color:var(--ink-3); font-weight:600; font-size:15px}
.wkwin{display:inline-grid; place-items:center; min-width:38px; padding:6px 0; border-radius:12px;
  background:var(--win-bg); color:var(--win-ink); box-shadow:inset 0 0 0 2px var(--win)}
.c-total{width:104px; min-width:104px; border-left:3px solid var(--line-2)}
tbody td.c-total,thead th.c-total{background:var(--soft)}
.total{font-weight:800; font-size:30px; letter-spacing:-.04em; font-variant-numeric:tabular-nums; line-height:1}
.wonc{width:96px; min-width:96px; border-left:2px solid var(--line)}
.won{font-weight:800; font-size:18px; font-variant-numeric:tabular-nums}
.won.zero{color:var(--ink-3); font-weight:600; font-size:15px}

.legend{display:flex; gap:24px; flex-wrap:wrap; margin-top:20px; color:var(--ink-2); font-size:14px; font-weight:600}
.legend span{display:flex; align-items:center; gap:9px}
.key{width:22px; height:22px; border-radius:8px; flex:0 0 auto}
.key--hit{background:var(--hit-bg); box-shadow:inset 0 0 0 2px var(--hit)}
.key--miss{background:var(--miss-bg)}
.key--win{background:var(--win-bg); box-shadow:inset 0 0 0 2px var(--win)}
.note-mock{margin-top:24px; padding:16px 20px; background:var(--card); border-radius:20px;
  color:var(--ink-3); font-size:13.5px; box-shadow:var(--shadow)}
.pending{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:34px; margin-top:24px}
.pending h2{font-size:24px; font-weight:800; letter-spacing:-.03em}
.pending p{color:var(--ink-2); margin:8px 0 0; max-width:56ch}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
.testbar{background:#FFF6DC; border-bottom:2px solid #E9A400; color:#8A6200}
.testbar__in{max-width:1260px; margin:0 auto; padding:12px 18px; display:flex; gap:16px;
  align-items:center; flex-wrap:wrap; font-size:14.5px; font-weight:600; line-height:1.45}
.testbar b{font-weight:800}
.testbar #clockline{display:block; font-weight:500}
.testreset{margin-left:auto; font-family:inherit; font-weight:700; font-size:13.5px;
  background:#fff; color:#8A6200; border:2px solid #E9A400; border-radius:99px; padding:9px 16px; cursor:pointer}
.testreset:hover{background:#FFEFC0}
</style>

<script>
const LOGOS=(function(){var o={},a=["ARI", "ATL", "BAL", "BUF", "CAR", "CHI", "CIN", "CLE", "DAL", "DEN", "DET", "GB", "HOU", "IND", "JAX", "KC", "LAC", "LAR", "LV", "MIA", "MIN", "NE", "NFL", "NO", "NYG", "NYJ", "PHI", "PIT", "SEA", "SF", "TB", "TEN", "WAS"];for(var i=0;i<a.length;i++)o[a[i]]='assets/logos/'+a[i]+'.png';return o;})();
/* --- Test-week clock -------------------------------------------------------
   Hour 1 = the Thursday night game.  Hour 2 = the Sunday morning games, which
   is also when picks close.  Hour 3 = Sunday afternoon.  Hour 4 = Sunday night.
   Hour 5 = Monday night.  The clock starts on first visit and both test pages
   share it, so the pick sheet and the standings always agree.               */
const HOUR = 3600*1000;
const CLOCK_KEY = 'suecouser.nflpool.testclock';
function testStart(){
  try{
    var a = localStorage.getItem(CLOCK_KEY);
    if(!a){ a = String(Date.now()); localStorage.setItem(CLOCK_KEY, a); }
    return Number(a);
  }catch(e){ return Date.now(); }
}
const T0 = testStart();
const hhmm = ms => new Date(ms).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const SLOTS = [
  {h:1, name:'Thursday night game'},
  {h:2, name:'Sunday morning games — picks close'},
  {h:3, name:'Sunday afternoon games'},
  {h:4, name:'Sunday night game'},
  {h:5, name:'Monday night game'}
];
function clockBar(){
  var el = document.getElementById('clockline'); if(!el) return;
  var now = Date.now(), next = SLOTS.find(s => now < T0 + s.h*HOUR);
  var line = 'Clock started ' + hhmm(T0) + '. Picks close ' + hhmm(T0 + 2*HOUR) + '.';
  if(next){
    var mins = Math.ceil((T0 + next.h*HOUR - now)/60000);
    line += ' Next up: ' + next.name + ' at ' + hhmm(T0 + next.h*HOUR)
          + ' (' + (mins > 59 ? Math.floor(mins/60)+'h '+(mins%60)+'m' : mins+' min') + ').';
  } else line += ' Every game has been played.';
  el.textContent = line;
}
setInterval(clockBar, 15000);
document.addEventListener('DOMContentLoaded', clockBar);

const TEAMS={ARI:{c:'Arizona',n:'Cardinals',p:'#97233F'},ATL:{c:'Atlanta',n:'Falcons',p:'#A71930'},BAL:{c:'Baltimore',n:'Ravens',p:'#241773'},BUF:{c:'Buffalo',n:'Bills',p:'#00338D'},CAR:{c:'Carolina',n:'Panthers',p:'#0085CA'},CHI:{c:'Chicago',n:'Bears',p:'#0B162A'},CIN:{c:'Cincinnati',n:'Bengals',p:'#FB4F14'},CLE:{c:'Cleveland',n:'Browns',p:'#311D00'},DAL:{c:'Dallas',n:'Cowboys',p:'#041E42'},DEN:{c:'Denver',n:'Broncos',p:'#FB4F14'},DET:{c:'Detroit',n:'Lions',p:'#0076B6'},GB:{c:'Green Bay',n:'Packers',p:'#203731'},HOU:{c:'Houston',n:'Texans',p:'#03202F'},IND:{c:'Indianapolis',n:'Colts',p:'#002C5F'},JAX:{c:'Jacksonville',n:'Jaguars',p:'#006778'},KC:{c:'Kansas City',n:'Chiefs',p:'#E31837'},LV:{c:'Las Vegas',n:'Raiders',p:'#101820'},LAC:{c:'Los Angeles',n:'Chargers',p:'#0080C6'},LAR:{c:'Los Angeles',n:'Rams',p:'#003594'},MIA:{c:'Miami',n:'Dolphins',p:'#008E97'},MIN:{c:'Minnesota',n:'Vikings',p:'#4F2683'},NE:{c:'New England',n:'Patriots',p:'#002244'},NO:{c:'New Orleans',n:'Saints',p:'#101820'},NYG:{c:'New York',n:'Giants',p:'#0B2265'},NYJ:{c:'New York',n:'Jets',p:'#125740'},PHI:{c:'Philadelphia',n:'Eagles',p:'#004C54'},PIT:{c:'Pittsburgh',n:'Steelers',p:'#101820'},SF:{c:'San Francisco',n:'49ers',p:'#AA0000'},SEA:{c:'Seattle',n:'Seahawks',p:'#002244'},TB:{c:'Tampa Bay',n:'Buccaneers',p:'#D50A0A'},TEN:{c:'Tennessee',n:'Titans',p:'#0C2340'},WAS:{c:'Washington',n:'Commanders',p:'#5A1414'}};

/* ---- who is in the pool, all season ---- */
const ENTRANTS=[
 {team:'Turf Toe Terry',     who:'Terry Bishop'},
 {team:'The Armchair QBs',   who:'Dana Whitfield'},
 {team:'Cheese Curd Curse',  who:'Marco Ruiz'},
 {team:'Fourth & Long John', who:'Jonathan Pike'},
 {team:'Hail Mary',          who:'Grace Okafor'},
 {team:'Pylon Patrol',       who:'Sam Delacroix'},
 {team:'Two-Minute Warning', who:'Priya Raman'},
 {team:'Blitz Kids',         who:'Kevin Marsh'},
 {team:'Punt God',           who:'Alex Torrence'},
 {team:'The Waterboys',      who:'Nina Castellanos'}
];

/* ---- Test week: the real schedule ---- */
const W1=[
 {id:'t1',a:'BUF',h:'NYJ'},{id:'t2',a:'KC',h:'DEN'},{id:'t3',a:'GB',h:'CHI'},{id:'t4',a:'SF',h:'SEA'},
 {id:'t5',a:'MIA',h:'NE'},{id:'t6',a:'LAR',h:'ARI'},{id:'t7',a:'TB',h:'CIN'},{id:'t8',a:'DET',h:'MIN'},
 {id:'t9',a:'DAL',h:'PHI'},{id:'t10',a:'BAL',h:'PIT',gotw:true}
];
/* Weeks 2 onwards are placeholders until the real fixtures are typed in. */
const ABBRS=Object.keys(TEAMS);
function placeholder(n){
  const off=(n*2)%32, out=[];
  for(let i=0;i<16;i++){
    out.push({id:'w'+n+'g'+(i+1), a:ABBRS[(i*2+off)%32], h:ABBRS[(i*2+1+off)%32], gotw:i===15});
  }
  return out;
}
const DEADLINES=[new Date(T0 + 2*HOUR).toISOString()];
const DEADLINE_TEXT=[hhmm(T0 + 2*HOUR) + ' today'];
const WEEKS=DEADLINES.map((d,i)=>({
  n:i+1, label:'Test week', deadline:new Date(d), deadlineText:DEADLINE_TEXT[i],
  games:i===0?W1:placeholder(i+1), real:i===0, results:{}, actual:null
}));

/* ---- sample sheets, so the shape of the thing is visible ---- */
function seed(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0)%1000; }
WEEKS.forEach(w=>{
  w.picks = ENTRANTS.map(e=>{
    const o={}; w.games.forEach(g=>{ o[g.id] = seed(e.team+'|w'+w.n+'|'+g.id)<560 ? g.h : g.a; }); return o;
  });
  w.ties = ENTRANTS.map(e=> 34 + seed('tie|'+e.team+'|'+w.n)%28);
  w.sample = {};                       /* what a played week would look like */
  w.games.forEach(g=>{ w.sample[g.id] = seed('res|w'+w.n+'|'+g.id)<520 ? g.h : g.a; });
  w.sampleActual = 41 + w.n*3;
});

/* A week stays "now" until its last game is done, roughly 36 hours past the
   deadline, which covers the Sunday afternoon games through Monday night. */
WEEKS.forEach(w=>{ w.ends = new Date(w.deadline.getTime() + 36*3600*1000); });
function currentWeekN(){
  const now = Date.now();
  const w = WEEKS.find(x => now < x.ends.getTime());
  return w ? w.n : WEEKS[WEEKS.length-1].n;
}

let tab = currentWeekN();     /* 'season' or a week number */
let preview = false;          /* mock-up only: show the season as if it had been played */

const revealed = w => preview || Date.now() >= w.deadline.getTime();
function resultsOf(w){ return preview ? w.sample : w.results; }
function actualOf(w){ return preview ? w.sampleActual : w.actual; }
function called(w){ return Object.keys(resultsOf(w)).length; }
function scoreOf(w,i){ const r=resultsOf(w), p=w.picks[i];
  return w.games.reduce((n,g)=> n + (r[g.id] && r[g.id]===p[g.id] ? 1 : 0), 0); }
function offBy(w,i){ const a=actualOf(w); return a==null ? null : Math.abs(a - w.ties[i]); }

/* rows for one week, best first */
function weekRows(w){
  const rows = ENTRANTS.map((e,i)=>({e,i,s:scoreOf(w,i),o:offBy(w,i)}));
  if(called(w)) rows.sort((x,y)=> y.s-x.s || ((x.o??999)-(y.o??999)) || x.e.team.localeCompare(y.e.team));
  return rows;
}
/* who took the week, only once every game is in and any tie is settled */
function weekWinner(w){
  if(!revealed(w) || called(w) !== w.games.length) return null;
  const rows = weekRows(w), top = rows[0], level = rows.filter(r=>r.s===top.s);
  if(level.length === 1) return top;
  if(actualOf(w) == null) return null;
  const best = Math.min(...level.map(r=>r.o));
  const closest = level.filter(r=>r.o===best);
  return closest.length === 1 ? closest[0] : null;
}
function seasonRows(){
  const rows = ENTRANTS.map((e,i)=>{
    const per = WEEKS.map(w => revealed(w) && called(w) ? scoreOf(w,i) : null);
    const won = WEEKS.filter(w => { const x = weekWinner(w); return x && x.i === i; }).length;
    return {e, i, per, total: per.reduce((a,b)=> a + (b||0), 0), won};
  });
  rows.sort((x,y)=> y.total-x.total || y.won-x.won || x.e.team.localeCompare(y.e.team));
  return rows;
}

/* ------------------------------------------------------------------ views */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function drawTabs(){
  const cur = currentWeekN();
  document.getElementById('tabs').innerHTML =
    WEEKS.map(w =>
      '<button class="tab'+(tab===w.n?' on':'')+(w.n===cur?' now':'')+'" data-tab="'+w.n+'" type="button">'
      + w.label
      + (w.n===cur ? '<span class="nowtag">Now</span>' : '')
      + (weekWinner(w) ? '<span class="dot" title="Week decided"></span>' : '')
      + '</button>').join('')
    + '<button class="tab season'+(tab==='season'?' on':'')+'" data-tab="season" type="button">Season standings</button>';
}

function seasonView(){
  const rows = seasonRows(), any = rows.some(r => r.total > 0);
  document.getElementById('h1').textContent = 'Season standings';
  document.getElementById('sub').textContent = any
    ? 'Every week added up. Most correct picks over the season sits top; the weeks-won column breaks a tie of pride, not of rank.'
    : 'Nothing has been played yet. As each week closes, the scores land here and the table sorts itself.';
  document.getElementById('tally').innerHTML =
    '<div class="stat"><span>In the pool</span><b>'+ENTRANTS.length+'</b></div>'
    + '<div class="stat"><span>Weeks played</span><b>'+WEEKS.filter(w=>revealed(w)&&called(w)).length+' of '+WEEKS.length+'</b></div>'
    + '<div class="stat lead"><span>Leading</span><b>'+(any?esc(rows[0].e.team):'&mdash;')+'</b></div>';

  let html = '<div class="controls"><div class="controls__lead">The season so far'
    + '<span>Open a week above to see the picks behind these numbers.</span></div><div class="spacer"></div>'
    + '<button class="btn" id="preview">'+(preview?'Back to the real table':'Preview a played season')+'</button></div>';

  html += '<div class="scroller"><table class="stand"><thead><tr>'
    + '<th class="c-rank hd">#</th><th class="c-team hd">Team</th>'
    + WEEKS.map(w=>'<th class="wkcol hd">'+w.label.replace('Week ','Wk ')+'</th>').join('')
    + '<th class="c-total hd">Season<br>total</th><th class="wonc hd">Weeks<br>won</th>'
    + '</tr></thead><tbody>'
    + rows.map((r,idx)=>{
        const champ = any && idx===0;
        return '<tr'+(champ?' class="champ"':'')+'>'
          + '<td class="c-rank"><span class="rank">'+(idx+1)+'</span>'
 + '</td>'
          + '<td class="c-team"><div class="who"><b>'+esc(r.e.team)+'</b><span>'+esc(r.e.who)+'</span></div></td>'
          + r.per.map((v,wi)=>{
              if(v===null) return '<td class="wkcol"><span class="wk none">&mdash;</span></td>';
              const win = weekWinner(WEEKS[wi]);
              const mine = win && win.i === r.i;
              return '<td class="wkcol"><span class="wk'+(mine?' wkwin':'')+'">'+v+'</span></td>';
            }).join('')
          + '<td class="c-total"><span class="total">'+r.total+'</span></td>'
          + '<td class="wonc"><span class="won'+(r.won?'':' zero')+'">'+(r.won||'–')+'</span></td></tr>';
      }).join('')
    + '</tbody></table></div>';

  html += '<div class="legend"><span><i class="key key--win"></i> Won that week</span>'
    + '<span>Ranked by season total, then by weeks won.</span></div>';
  if(!any) html += '<div class="pending"><h2>No weeks in the book yet</h2>'
    + '<p>Test week closes '+WEEKS[0].deadlineText+'. Until a week closes its column stays empty.</p></div>';
  html += '<div class="note-mock">Mock-up note: ten sample sheets, and weeks two onwards use placeholder fixtures until the real schedule is typed in.</div>';
  return html;
}

function weekView(w){
  document.getElementById('h1').textContent = w.label;
  const win = weekWinner(w);
  document.getElementById('sub').textContent = !revealed(w)
    ? 'Sheets are coming in. Everyone’s picks stay hidden from each other until picks close.'
    : 'Every sheet side by side. Tap the winning team in a column heading and the grid marks itself — green for a correct pick, grey for a miss.';
  document.getElementById('tally').innerHTML =
    '<div class="stat"><span>Sheets in</span><b>'+ENTRANTS.length+'</b></div>'
    + '<div class="stat"><span>Games final</span><b>'+(revealed(w)?called(w)+' of '+w.games.length:'Sealed')+'</b></div>'
    + '<div class="stat lead"><span>'+(win?'Won by':'Leading')+'</span><b>'
      + (revealed(w)&&called(w) ? esc(weekRows(w)[0].e.team) : '&mdash;') + '</b></div>';

  if(!revealed(w)) return sealedView(w);

  const rows = weekRows(w), c = called(w);
  const bestOff = Math.min(...rows.map(r => r.o ?? Infinity));
  let html = '<div class="controls"><div class="controls__lead">Marking '+w.label
    + '<span>Tap a team above any column to call that game.</span></div>'
    + '<div class="ctl"><label for="actual">Game of the Week total</label>'
    + '<input id="actual" type="number" min="0" max="120" inputmode="numeric" placeholder="&mdash;" value="'+(actualOf(w)??'')+'"></div>'
    + '<div class="spacer"></div>'
    + '<button class="btn" id="demo">Fill in a sample week</button>'
    + '<button class="btn" id="clear">Clear results</button>'
    + '<button class="btn btn--go" id="copy">Copy grid</button></div>';

  if(c === w.games.length){
    const level = rows.filter(r => r.s === rows[0].s);
    html += '<div class="banner on"><span class="cup">Winner</span><div><b>'+esc(rows[0].e.team)+'</b> <span>'
      + (win ? (level.length>1
            ? 'wins '+w.label+' on the tiebreaker — '+rows[0].s+' correct, '+rows[0].o+' off the Game of the Week total.'
            : 'wins '+w.label+' with '+rows[0].s+' correct out of '+w.games.length+'.')
          : 'and '+(level.length-1)+' other'+(level.length>2?'s':'')+' are level on '+rows[0].s+'. Enter the Game of the Week total to settle it.')
      + '</span></div></div>';
  }

  html += '<div class="scroller"><table><thead><tr>'
    + '<th class="c-rank hd">#</th><th class="c-team hd">Team</th>'
    + w.games.map(g=>'<th class="gcol'+(g.gotw?' gotw':'')+'"><div class="gh">'
        + pickBtn(w,g,g.a)+'<span class="gh__at">AT</span>'+pickBtn(w,g,g.h)+'</div></th>').join('')
    + '<th class="c-score hd">Correct</th><th class="tiecol hd">Score<br>guess</th><th class="tiecol hd">Off by</th>'
    + '</tr></thead><tbody>'
    + rows.map((r,idx)=>{
        const champ = win && win.i === r.i;
        let tds = '<td class="c-rank"><span class="rank">'+(idx+1)+'</span></td>'
          + '<td class="c-team"><div class="who"><b>'+esc(r.e.team)+'</b><span>'+esc(r.e.who)+'</span></div></td>';
        w.games.forEach(g=>{
          const ab = w.picks[r.i][g.id], res = resultsOf(w)[g.id];
          const state = !res ? '' : (res===ab ? ' hit' : ' miss');
          tds += '<td class="gcol"><div class="cell'+state+'"><img src="'+LOGOS[ab]+'" alt="'+ab+'" title="'+TEAMS[ab].c+' '+TEAMS[ab].n+'"></div></td>';
        });
        tds += '<td class="c-score"><span class="score">'+(c?r.s:'&mdash;')+(c?'<em>of '+c+'</em>':'')+'</span></td>'
          + '<td class="tiecol"><span class="tieval">'+w.ties[r.i]+'</span></td>'
          + '<td class="tiecol"><span class="tieoff'+(r.o!=null&&r.o===bestOff?' best':'')+'">'+(r.o==null?'&mdash;':r.o)+'</span></td>';
        return '<tr'+(champ?' class="champ"':'')+'>'+tds+'</tr>';
      }).join('')
    + '</tbody><tfoot><tr>'
    + '<td class="c-rank"></td><td class="c-team foot-lbl">Everyone picked</td>'
    + w.games.map(g=>{
        const homeN = w.picks.filter(p => p[g.id]===g.h).length;
        const pct = Math.round(homeN/ENTRANTS.length*100);
        const lead = pct>=50 ? g.h : g.a, leadPct = pct>=50 ? pct : 100-pct;
        return '<td class="gcol"><div class="consensus"><div class="cbar">'
          + '<i style="width:'+(100-pct)+'%;background:'+TEAMS[g.a].p+'"></i>'
          + '<i style="width:'+pct+'%;background:'+TEAMS[g.h].p+'"></i></div>'
          + '<span class="cpct">'+leadPct+'% '+lead+'</span></div></td>';
      }).join('')
    + '<td class="c-score"></td><td class="tiecol"></td><td class="tiecol"></td>'
    + '</tr></tfoot></table></div>';

  html += '<div class="legend"><span><i class="key key--hit"></i> Correct pick</span>'
    + '<span><i class="key key--miss"></i> Missed</span>'
    + '<span><i class="key key--win"></i> Winner of the week</span>'
    + '<span>Rows re-sort by score the moment a game is called.</span></div>';
  if(!w.real) html += '<div class="note-mock">'+w.label+' uses placeholder fixtures. Drop the real schedule in and everything else here keeps working.</div>';
  return html;
}

function pickBtn(w,g,ab){
  const t = TEAMS[ab], on = resultsOf(w)[g.id] === ab;
  return '<button class="gh__pick'+(on?' win':'')+'" data-game="'+g.id+'" data-team="'+ab+'" '
    + 'aria-pressed="'+on+'" title="Mark '+t.n+' as the winner"><img src="'+LOGOS[ab]+'" alt="">'+ab+'</button>';
}

function sealedView(w){
  return '<section class="sealed"><div class="sealed__head"><span class="lk">🔒</span><div>'
    + '<h2>Picks are sealed</h2>'
    + '<p>Nobody sees anybody else’s sheet until picks close — <b>'+w.deadlineText+'</b>. '
    + 'Until then all you can see is who has sent theirs in. To look at your own sheet, or change it, '
    + 'go back to the pick sheet on the device you filled it in on.</p></div></div>'
    + '<div class="clock" id="clock"></div>'
    + '<h3>Sheets in so far <em>('+ENTRANTS.length+' of '+ENTRANTS.length+')</em></h3>'
    + '<ul class="inlist">'+ENTRANTS.map(e=>'<li><span class="ok">✓</span><div><b>'+esc(e.team)+'</b>'
        + '<span>'+esc(e.who)+'</span></div></li>').join('')+'</ul>'
    + '<div class="peek"><button class="btn" id="preview">Preview the revealed grid</button>'
    + '<p>Mock-up control only. On the real thing there is no way to look early.</p></div></section>'
    + '<div class="note-mock">Mock-up note: ten sample sheets. Once the pick sheet saves for real, submissions land here as they arrive.</div>';
}

/* ------------------------------------------------------------------ wiring */
function drawClock(w){
  const el = document.getElementById('clock'); if(!el) return;
  let ms = w.deadline.getTime() - Date.now();
  if(ms <= 0){ render(); return; }
  const d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
  el.innerHTML = [[d,'Days'],[h,'Hours'],[m,'Minutes'],[s,'Seconds']]
    .map(([v,l])=>'<div><b>'+String(v).padStart(2,'0')+'</b><span>'+l+'</span></div>').join('');
}
function render(){
  drawTabs();
  const view = document.getElementById('view');
  if(tab === 'season'){ view.innerHTML = seasonView(); }
  else {
    const w = WEEKS.find(x=>x.n===tab);
    view.innerHTML = weekView(w);
    if(!revealed(w)) drawClock(w);
  }
  wire();
}
function wire(){
  const w = tab==='season' ? null : WEEKS.find(x=>x.n===tab);
  const pv = document.getElementById('preview');
  if(pv) pv.addEventListener('click', ()=>{ preview = !preview; render(); });
  if(!w) return;
  const head = document.querySelector('thead');
  if(head) head.addEventListener('click', e=>{
    const b = e.target.closest('.gh__pick'); if(!b) return;
    if(preview){ preview = false; w.results = Object.assign({}, w.sample); w.actual = w.sampleActual; }
    if(w.results[b.dataset.game] === b.dataset.team) delete w.results[b.dataset.game];
    else w.results[b.dataset.game] = b.dataset.team;
    render();
  });
  const act = document.getElementById('actual');
  if(act) act.addEventListener('input', e=>{ w.actual = e.target.value==='' ? null : Number(e.target.value); render(); });
  const demo = document.getElementById('demo');
  if(demo) demo.addEventListener('click', ()=>{ w.results = Object.assign({}, w.sample); w.actual = w.sampleActual; preview=false; render(); });
  const clr = document.getElementById('clear');
  if(clr) clr.addEventListener('click', ()=>{ w.results = {}; w.actual = null; render(); });
  const cp = document.getElementById('copy');
  if(cp) cp.addEventListener('click', async ()=>{
    const rows = weekRows(w);
    const hdr = ['Rank','Team','Name','Correct'].concat(w.games.map(g=>g.a+' at '+g.h)).concat(['Score guess','Off by']);
    const lines = [hdr.join(',')].concat(rows.map((r,i)=>
      [i+1,'"'+r.e.team+'"','"'+r.e.who+'"',r.s].concat(w.games.map(g=>w.picks[r.i][g.id]))
        .concat([w.ties[r.i], r.o ?? '']).join(',')));
    try { await navigator.clipboard.writeText(lines.join('\n')); cp.textContent='Copied'; }
    catch(e){ cp.textContent='Copy blocked'; }
    setTimeout(()=>{ cp.textContent='Copy grid'; }, 1600);
  });
}
document.getElementById('tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  tab = t.dataset.tab === 'season' ? 'season' : Number(t.dataset.tab);
  render(); window.scrollTo({top:0, behavior:'smooth'});
});
setInterval(()=>{ if(tab!=='season'){ const w=WEEKS.find(x=>x.n===tab); if(w && !revealed(w)) drawClock(w); } }, 1000);
render();

var __r = document.getElementById('clockreset');
if(__r) __r.addEventListener('click', function(){
  try{ localStorage.removeItem(CLOCK_KEY); }catch(e){}
  try{ localStorage.removeItem('suecouser.nflpool.week0.entries'); }catch(e){}
  location.reload();
});
clockBar();
</script>
